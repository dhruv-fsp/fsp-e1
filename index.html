<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-store" />
<meta name="theme-color" content="#1538b4" />
<title>FSP · RaceBird Liveries</title>
<meta name="description" content="FSP livery concepts for the E1 RaceBird: eleven liveries from Pixel Wake to Pixel Print, with colourways, a gold cockpit and the HRX partner logo." />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-1 0 8.75 8.75' fill='%231450e6'%3E%3Crect width='2' height='2'/%3E%3Crect x='2.25' width='2' height='2'/%3E%3Crect x='4.5' width='2' height='2'/%3E%3Crect y='2.25' width='2' height='2'/%3E%3Crect y='4.5' width='2' height='2'/%3E%3Crect x='2.25' y='4.5' width='2' height='2'/%3E%3Crect y='6.75' width='2' height='2'/%3E%3C/svg%3E" />
<link rel="preload" href="./fonts/Archivo-variable.woff2" as="font" type="font/woff2" crossorigin />
<script type="module" src="./model-viewer.min.js"></script>
<link rel="stylesheet" href="./hud.css?v=4" />
</head>
<body>

<!-- Layer 0: text and HUD, behind the boat -->
<div class="backdrop">
  <div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>

  <div class="brand">
    <img src="./images/fsp-f-white.svg" alt="FSP" />
    <div>
      <div class="t1">FSP</div>
      <div class="t2 mono">E1 · RaceBird</div>
    </div>
  </div>
  <div class="tag mono"><b>Global competition, solved.</b><br />Powered by AI, ranked worldwide.</div>

  <div class="intro">
    <span class="kicker mono">Livery concepts</span>
    <h1>fsp <span class="accent">racebird.</span></h1>
  </div>

  <div class="word" id="word" aria-hidden="true"><span id="wordText"></span></div>

  <div class="info" id="info" aria-live="polite">
    <div class="count mono"><span>Livery</span><b id="infoNum">01</b><i></i><span id="infoAll">05</span></div>
    <div class="name" id="infoName"></div>
    <p class="desc" id="infoDesc"></p>
  </div>

  <div class="readout mono" aria-hidden="true">
    <div>HDG <b id="hdg">000°</b> · EL <b id="elv">00°</b></div>
    <div>Drag to orbit · Scroll to zoom · ← → switch</div>
  </div>
</div>

<!-- Layer 1: the boat -->
<model-viewer id="mv" src="./racebird.glb?v=10" alt="FSP RaceBird"
  camera-controls touch-action="none" interaction-prompt="none"
  auto-rotate auto-rotate-delay="0" rotation-per-second="14deg"
  shadow-intensity="1" shadow-softness="0.45" exposure="0.82" tone-mapping="commerce"
  environment-image="./env/studio.hdr"
  camera-orbit="45deg 72deg 110%" min-field-of-view="6deg" max-field-of-view="40deg"></model-viewer>

<!-- Layer 2: controls -->
<nav class="pages mono" aria-label="Pages"><a href="./" aria-current="page">Liveries</a><a href="./merch.html">Merch</a></nav>
<nav class="controls" id="controls" aria-label="Livery">
  <button class="icon nav" id="prev" aria-label="Previous livery">
    <svg viewBox="0 0 18 18"><path d="M11 4 6 9l5 5"/></svg>
  </button>
  <div class="dock" id="dock" role="group" aria-label="Choose a livery"></div>
  <button class="icon nav" id="next" aria-label="Next livery">
    <svg viewBox="0 0 18 18"><path d="m7 4 5 5-5 5"/></svg>
  </button>
</nav>
<div class="colorway mono" id="colorway" role="group" aria-label="Colourway">
  <div class="ttl">Colourway</div>
  <div class="cw-row" id="cwRow"></div>
  <div class="sp-row">
    <span>Cockpit</span>
    <button class="sp-toggle" id="goldToggle" type="button" aria-pressed="false" aria-label="Gold cockpit">
      <i class="chip-gold" aria-hidden="true"></i><span class="sp-name">Gold</span><i class="switch" aria-hidden="true"></i>
    </button>
  </div>
  <div class="sp-row">
    <span>Partner</span>
    <button class="sp-toggle" id="spToggle" type="button" aria-pressed="true" aria-label="HRX partner logo">
      <img src="./sponsors/hrx-logo.png" alt="HRX" /><i class="switch" aria-hidden="true"></i>
    </button>
  </div>
  <div class="sp-opts" id="spOpts">
    <div class="sp-line"><span>Layout</span><div class="chips" id="spLayouts"></div></div>
    <div class="sp-line"><span>Logo</span><div class="chips" id="spStyles"></div></div>
  </div>
</div>
<div class="tools">
  <button class="icon" id="paint" aria-label="Colourway" title="Colourway" aria-controls="colorway" aria-expanded="false">
    <svg viewBox="0 0 18 18"><path d="M3 3h5v5H3zM10 3h5v5h-5zM3 10h5v5H3zM10 10h5v5h-5z"/></svg>
  </button>
  <button class="icon" id="reset" aria-label="Reset view" title="Reset view">
    <svg viewBox="0 0 18 18"><path d="M3.5 9a5.5 5.5 0 1 0 1.6-3.9"/><path d="M3.5 3v3.5H7"/></svg>
  </button>
  <button class="icon" id="play" aria-label="Pause rotation" title="Pause rotation">
    <svg class="i-pause" viewBox="0 0 18 18"><path d="M6.5 4v10M11.5 4v10"/></svg>
    <svg class="i-play" viewBox="0 0 18 18"><path d="M6 4v10l8-5z"/></svg>
  </button>
</div>

<div class="loader" id="loader">
  <img src="./images/fsp-f-white.svg" alt="" />
  <div class="bar"><i id="bar"></i></div>
  <p class="mono">Loading RaceBird</p>
</div>

<script>
const mv = document.getElementById('mv');
const dock = document.getElementById('dock');
const $ = id => document.getElementById(id);

// Bump ASSETS (and the ?v= on racebird.glb) when a livery or the model changes:
// vercel.json lets browsers cache these files for a day. (No ?v= on the .hdr:
// model-viewer picks its loader from the file extension.)
const ASSETS = '20';
const VERSIONS = [
  { id:'wake',        tab:'01', label:'Pixel Wake',  desc:'A solid blue stern breaks forward into FSP pixel blocks behind a lime edge.' },
  { id:'telemetry',   tab:'02', label:'Telemetry',   desc:'White hull, a blue waterline sweep and the FSP ASCII hero across the nose.' },
  { id:'fingerprint', tab:'03', label:'Fingerprint', desc:'The FSP fingerprint pressed into the front deck around a white pixel F.' },
  { id:'current',     tab:'04', label:'Current',     desc:'Blue and lime ribbons flow from the stern into a pixel arrowhead.' },
  { id:'negative',    tab:'05', label:'Negative',    desc:'A split-tone blade: blue on one side, white on the other, the 05 counterchanged.' },
  { id:'delta',       tab:'06', label:'Delta',       desc:'Hard-edged blocking: a navy saddle, blue shards and a blue delta nose with a lime pin.' },
  { id:'chevron',     tab:'07', label:'Chevron',     desc:'Three FSP-blue speed chevrons charge at the nose, heaviest in front, lime-edged.' },
  { id:'strike',      tab:'08', label:'Strike',      desc:'Blue, navy and lime racing stripes slash across the bow with hard pointed tips.' },
  { id:'blade',       tab:'09', label:'Blade',       desc:'Twin FSP-blue blades fold over the gunwale into a sharp spear at the nose.' },
  { id:'shard',       tab:'10', label:'Shard',       desc:'A faceted blue spearhead shatters over the bow, its shards flying back along the hull.' },
  { id:'pixelprint',  tab:'11', label:'Pixel Print', desc:'The FSP fingerprint in pixels: staircase ridges loop a blue F core, lime scan band.' },
].map(v => ({ ...v, file:`./liveries/fsp-${v.id}.png?v=${ASSETS}`, orange:`./liveries/fsp-${v.id}-orange.png?v=${ASSETS}` }));
$('infoAll').textContent = String(VERSIONS.length).padStart(2, '0');

// Render at full resolution: by default model-viewer drops its resolution under load.
customElements.whenDefined('model-viewer').then(() => { customElements.get('model-viewer').minimumRenderScale = 1; });

// Crisp livery graphics at grazing angles: raise anisotropic filtering on the
// model's textures (model-viewer internals; a harmless no-op if they change).
function sharpen(){
  try{
    const scene = sceneOf();
    if(!scene) return;
    scene.traverse(o => {
      const t = o.isMesh && o.material && o.material.map;
      if(t && t.anisotropy < 16){ t.anisotropy = 16; t.needsUpdate = true; }
    });
    if(scene.queueRender) scene.queueRender();
  }catch(e){ /* keep the default filtering */ }
}

// Open on ?v=<id or number>, e.g. ?v=telemetry or ?v=02.
const want = (new URLSearchParams(location.search).get('v') || '').toLowerCase();
const startIdx = Math.max(0, VERSIONS.findIndex(v => v.id === want || v.tab === want));

let liveryMat = null;
const cache = {};                                    // id + texture set -> Promise<texture>
const texture = (v, set) => (cache[v.id + set] ||= mv.createTexture(set === 'orange' ? v.orange : v.file));
let current = -1;

// ---------- giant livery name: fit to the width, capped by height ----------
const word = $('word'), wordText = $('wordText');
const mqPhone = window.matchMedia('(max-width: 760px)');
function fitWord(){
  wordText.style.fontSize = '100px';
  const w = wordText.getBoundingClientRect().width;
  if(!w) return;
  const vh = window.innerHeight, vw = window.innerWidth;
  const maxW = vw * (mqPhone.matches ? 0.94 : 0.9);
  const maxH = vh * (mqPhone.matches ? 0.2 : 0.34);
  wordText.style.fontSize = Math.min(100 * maxW / w, maxH) + 'px';
}

// ---------- livery info + name ----------
let infoTimer = 0;
function showInfo(v, animate){
  const set = () => {
    wordText.textContent = v.label.toLowerCase();
    fitWord();
    $('infoNum').textContent = v.tab;
    $('infoName').textContent = v.label;
    $('infoDesc').textContent = v.desc;
    word.classList.remove('out'); $('info').classList.remove('out');
  };
  clearTimeout(infoTimer);
  if(!animate){ set(); return; }
  word.classList.add('out'); $('info').classList.add('out');
  infoTimer = setTimeout(set, 200);
}

// ---------- switcher dock (segmented slider) ----------
const slider = document.createElement('div');
slider.className = 'slider';
dock.appendChild(slider);
const segs = VERSIONS.map((v, i) => {
  const b = document.createElement('button');
  b.className = 'seg';
  b.innerHTML = `<span class="n">${v.tab}</span><span class="l">${v.label}</span>`;
  b.title = v.label;
  b.setAttribute('aria-label', `${v.tab} ${v.label}`);
  b.addEventListener('click', () => { if(!swiped) apply(i); });
  dock.appendChild(b);
  return b;
});
const MANY = VERSIONS.length > 6;
dock.classList.toggle('many', MANY);
$('controls').classList.toggle('many', MANY);
const dockScrolls = () => dock.scrollWidth > dock.clientWidth + 1;
function moveSlider(i, instant){
  const seg = segs[i];
  slider.style.width = seg.offsetWidth + 'px';
  slider.style.transform = 'translateX(' + seg.offsetLeft + 'px)';
  if(dockScrolls()) dock.scrollTo({ left: seg.offsetLeft - (dock.clientWidth - seg.offsetWidth) / 2, behavior: instant ? 'auto' : 'smooth' });
}
window.addEventListener('resize', () => { if(current >= 0) moveSlider(current, true); fitWord(); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if(current >= 0) moveSlider(current, true); fitWord(); });

async function apply(i){
  i = (i + VERSIONS.length) % VERSIONS.length;
  if(i === current || !liveryMat) return;
  const v = VERSIONS[i], first = current < 0;
  current = i;
  segs.forEach((s, idx) => { s.classList.toggle('active', idx === i); s.setAttribute('aria-pressed', idx === i); });
  moveSlider(i, first);
  showInfo(v, !first);
  if(!first) syncURL();
  await showLivery();
}
// put the current livery, in the current colourway, on the boat
async function showLivery(){
  const i = current, c = colourway;
  let tex;
  try{ tex = await texture(VERSIONS[i], c.texture); }
  catch(e){ tex = await texture(VERSIONS[i], 'lime'); }   // no orange version yet: show the lime one
  if(current !== i || colourway !== c) return;      // a newer pick won the race
  liveryMat.pbrMetallicRoughness.baseColorTexture.setTexture(tex);
  sharpen();
  recolorLivery();
}
$('prev').addEventListener('click', () => apply(current - 1));
$('next').addEventListener('click', () => apply(current + 1));
document.addEventListener('keydown', e => {
  if(e.altKey || e.ctrlKey || e.metaKey) return;
  if(e.key === 'ArrowLeft') apply(current - 1);
  else if(e.key === 'ArrowRight') apply(current + 1);
  else if(/^[0-9]$/.test(e.key)){ const n = e.key === '0' ? 10 : +e.key; if(n <= VERSIONS.length) apply(n - 1); }
});

// swipe left / right on the dock (phones)
let swipeX = null, swipeY = 0, swiped = false;
const controls = $('controls');
controls.addEventListener('pointerdown', e => { swipeX = e.clientX; swipeY = e.clientY; swiped = false; });
controls.addEventListener('pointerup', e => {
  if(swipeX === null) return;
  if(dockScrolls() && e.target.closest('.dock')){ swipeX = null; return; }   // a scrolling tab strip swipes itself
  const dx = e.clientX - swipeX, dy = e.clientY - swipeY;
  swipeX = null;
  if(Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(dy) * 1.5){ swiped = true; apply(current + (dx < 0 ? 1 : -1)); setTimeout(() => swiped = false, 0); }
});

// ---------- camera: responsive default view, reset, play / pause ----------
// A dramatic diagonal hero on phones, a wide 3/4 turntable on desktop.
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let paused = reduceMotion;
function setResponsiveView(jump){
  if(mqPhone.matches){
    mv.setAttribute('camera-orbit', '118deg 43deg 100%');
    mv.setAttribute('field-of-view', '25deg');
    mv.removeAttribute('auto-rotate');              // hold the hero angle on phones
  } else {
    mv.setAttribute('camera-orbit', '45deg 72deg 110%');
    mv.removeAttribute('field-of-view');
    if(paused) mv.removeAttribute('auto-rotate'); else mv.setAttribute('auto-rotate', '');
  }
  if(jump && mv.jumpCameraToGoal) mv.jumpCameraToGoal();
}
setResponsiveView(false);                            // set initial framing before first paint
mqPhone.addEventListener('change', () => { setResponsiveView(true); fitWord(); });
$('reset').addEventListener('click', () => {
  if(mv.resetTurntableRotation) mv.resetTurntableRotation(0);
  setResponsiveView(false);                          // glide back rather than jump
});
const play = $('play');
function setPaused(p){
  paused = p;
  play.classList.toggle('paused', p);
  play.setAttribute('aria-label', p ? 'Resume rotation' : 'Pause rotation');
  play.title = play.getAttribute('aria-label');
  if(!mqPhone.matches){ if(p) mv.removeAttribute('auto-rotate'); else mv.setAttribute('auto-rotate', ''); }
}
play.addEventListener('click', () => setPaused(!paused));
if(paused) setPaused(true);

// HUD readout: viewing heading relative to the boat (turntable included) and elevation
const hdg = $('hdg'), elv = $('elv');
let lastRead = '';
function readout(){
  requestAnimationFrame(readout);
  if(!mv.loaded || mqPhone.matches) return;
  const o = mv.getCameraOrbit(), tt = mv.turntableRotation || 0;
  let h = ((o.theta - tt) * 180 / Math.PI) % 360; if(h < 0) h += 360;
  const e = Math.round(90 - o.phi * 180 / Math.PI);
  const s = String(Math.round(h) % 360).padStart(3, '0') + '|' + e;
  if(s === lastRead) return;
  lastRead = s;
  hdg.textContent = s.slice(0, 3) + '°';
  elv.textContent = String(e).padStart(2, '0') + '°';
}
requestAnimationFrame(readout);

// ---------- colourway ----------
// Blue + lime and blue + orange are painted textures: each design has its own orange
// version (livery-tools --variant=orange) where orange takes over a visible element.
// The other two recolour the lime texture live on the GPU: the liveries are painted
// from a fixed palette, so every texel is one palette colour or an anti-aliased blend
// of two; a small shader finds that pair and swaps in the chosen colours.
const SWATCHES = { blue:'#1450e6', orange:'#ff5b13', lime:'#c8f04a', dark:'#0a2540' };
const COLOURWAYS = [
  { label:'Blue<br>Lime',   a:'blue',   b:'lime',   texture:'lime' },
  { label:'Blue<br>Orange', a:'blue',   b:'orange', texture:'orange' },
  { label:'Orange<br>Blue', a:'orange', b:'blue',   texture:'lime', map:{ main:'orange', accent:'blue', dark:'dark' } },
  { label:'Dark<br>Lime',   a:'dark',   b:'lime',   texture:'lime', map:{ main:'dark', accent:'lime', dark:'blue' } },
];
let colourway = COLOURWAYS[0];                        // every visit starts on blue + lime
const rgb = h => [1, 3, 5].map(k => parseInt(h.slice(k, k + 2), 16) / 255);
const mixc = (a, b, t) => a.map((x, k) => x + (b[k] - x) * t);
function paletteMap(m){                              // [painted colour, shown colour]
  const W = rgb('#f5f6f8'), M = rgb(SWATCHES[m.main]), A = rgb(SWATCHES[m.accent]), D = rgb(SWATCHES[m.dark]);
  return [
    [W, W],
    [rgb('#1450e6'), M],
    [rgb('#2d6ae3'), mixc(M, W, .12)],               // hero tint of the main colour
    [rgb('#5b8def'), mixc(M, W, .33)],               // cool tint of the main colour
    [rgb('#c8f04a'), A],
    [rgb('#0a2540'), D],
    [rgb('#0a0e16'), rgb('#0a0e16')],                // structure: hull bottom, foil arms, E1 logos
  ];
}
let gl = null, glProg = null, glCanvas = null, glSponsor = null, glCockpit = null, glOut = null;
// One full-screen pass over the livery texture: optional palette swap (the colourway),
// the optional gold cockpit, then the optional partner logo: its light parts white on dark ground and ink on light
// ground (judged per logo on the CPU, see spotDark), its red parts red.
function recolor(img, m, sp, gold){
  if(!gl){
    glCanvas = document.createElement('canvas');
    gl = glCanvas.getContext('webgl', { premultipliedAlpha:false, preserveDrawingBuffer:true, antialias:false, alpha:false });
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    glProg = gl.createProgram();
    gl.attachShader(glProg, sh(gl.VERTEX_SHADER, 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));
    gl.attachShader(glProg, sh(gl.FRAGMENT_SHADER, `precision highp float;
      uniform sampler2D t;uniform sampler2D spm;uniform vec2 sz;uniform vec3 src[7];uniform vec3 dst[7];
      uniform sampler2D ckm;uniform float mapOn;uniform float spOn;uniform float goldOn;uniform vec4 spDark[3];uniform float spStyle;
      const vec3 GOLD=vec3(.788,.635,.353);
      vec3 mapc(vec3 c){
        if(mapOn<.5)return c;
        vec3 o=c;float best=1e9;
        for(int i=0;i<7;i++)for(int j=0;j<7;j++){
          if(j<i)continue;
          vec3 a=src[i],ab=src[j]-a;float L=dot(ab,ab);
          float k=L>0.?clamp(dot(c-a,ab)/L,0.,1.):0.;vec3 d=c-(a+ab*k);float e=dot(d,d);
          if(e<best){best=e;o=mix(dst[i],dst[j],k);}
        }
        return o;
      }
      vec3 ground(vec2 uv){                   // the livery as shown: colourway, then the gold cockpit
        return mix(mapc(texture2D(t,uv).rgb),GOLD,goldOn*texture2D(ckm,uv).r);
      }
      void main(){
        vec2 uv=vec2(gl_FragCoord.x/sz.x,1.-gl_FragCoord.y/sz.y);
        vec3 o=ground(uv);
        if(spOn>.5){
          vec3 m=texture2D(spm,uv).rgb;
          if(m.g+m.b>0.){
            float id=floor(m.r*255./25.+.5)-1.,dk=0.;
            for(int k=0;k<3;k++)for(int j=0;j<4;j++)if(float(k*4+j)==id)dk=spDark[k][j];
            vec3 ink=dk>.5?vec3(.961,.965,.973):vec3(.039,.055,.086),red=vec3(.835,.169,.11);
            if(spStyle>1.5)o=mix(o,ink,max(m.g,m.b));            // mono: the whole logo white or ink
            else if(spStyle>.5)o=mix(o,red,max(m.g,m.b));        // red: the whole logo in HRX red
            else{o=mix(o,ink,m.g);o=mix(o,red,m.b);}               // classic: white or ink, red tick
          }
        }
        gl_FragColor=vec4(o,1.);
      }`));
    gl.bindAttribLocation(glProg, 0, 'p');
    gl.linkProgram(glProg); gl.useProgram(glProg);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
    const tex = unit => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
      for(const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v); };
    tex(2); tex(1); tex(0);
    gl.uniform1i(gl.getUniformLocation(glProg, 't'), 0);
    gl.uniform1i(gl.getUniformLocation(glProg, 'spm'), 1);
    gl.uniform1i(gl.getUniformLocation(glProg, 'ckm'), 2);
  }
  const w = img.width, h = img.height, pal = paletteMap(m || { main:'blue', accent:'lime', dark:'dark' });
  glCanvas.width = w; glCanvas.height = h; gl.viewport(0, 0, w, h);
  gl.activeTexture(gl.TEXTURE0);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
  if(sp && glSponsor !== sp.img){ gl.activeTexture(gl.TEXTURE1); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, sp.img); glSponsor = sp.img; gl.activeTexture(gl.TEXTURE0); }
  if(gold && glCockpit !== gold.img){ gl.activeTexture(gl.TEXTURE2); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, gold.img); glCockpit = gold.img; gl.activeTexture(gl.TEXTURE0); }
  gl.uniform2f(gl.getUniformLocation(glProg, 'sz'), w, h);
  gl.uniform3fv(gl.getUniformLocation(glProg, 'src'), pal.flatMap(p => p[0]));
  gl.uniform3fv(gl.getUniformLocation(glProg, 'dst'), pal.flatMap(p => p[1]));
  gl.uniform1f(gl.getUniformLocation(glProg, 'mapOn'), m ? 1 : 0);
  gl.uniform1f(gl.getUniformLocation(glProg, 'spOn'), sp ? 1 : 0);
  gl.uniform1f(gl.getUniformLocation(glProg, 'goldOn'), gold ? 1 : 0);
  if(sp){ gl.uniform4fv(gl.getUniformLocation(glProg, 'spDark'), spotDark(img, m, gold, sp)); gl.uniform1f(gl.getUniformLocation(glProg, 'spStyle'), spStyle); }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // Hand three.js a 2D copy: on real GPUs Chrome re-reads a WebGL canvas source stale after
  // its first upload, so later changes (gold, partner logo) never reached the boat.
  if(!glOut) glOut = document.createElement('canvas');
  if(glOut.width !== w || glOut.height !== h){ glOut.width = w; glOut.height = h; }
  glOut.getContext('2d').drawImage(glCanvas, 0, 0);
  return glOut;
}
function sceneOf(){ const key = Object.getOwnPropertySymbols(mv).find(s => s.description === 'scene'); return key && mv[key]; }
// Swap the livery texture's pixels for the recoloured canvas (model-viewer internals,
// like sharpen(); if they change, the livery quietly stays as painted).
function recolorLivery(){
  try{
    const scene = sceneOf(), maps = new Set();
    if(!scene) return;
    scene.traverse(o => { const m = o.isMesh && o.material; if(m && m.name === 'M_Racebird_Livery Default' && m.map) maps.add(m.map); });
    const spo = sponsors[spLayout], m = colourway.map, sp = sponsorOn && spo && spo.ready ? spo : null, gold = goldOn && cockpit.ready ? cockpit : null;
    for(const map of maps){
      map.userData.fspOriginal ||= map.image;
      const want = m || sp || gold ? recolor(map.userData.fspOriginal, m, sp, gold) : map.userData.fspOriginal;
      if(map.image !== want || m || sp || gold){ map.image = want; map.needsUpdate = true; }
    }
    setFinish(!!gold);
    if(scene.queueRender) scene.queueRender();
  }catch(e){ console.warn('colourway unavailable', e); }
}
// ---------- gold cockpit (like the TBR livery): pod mask + metal/roughness map from livery-tools/cockpit.mjs ----------
let goldOn = false;
const cockpit = { img: new Image(), ready: false, mr: null };
function loadCockpit(){
  if(cockpit.loading) return cockpit.loading;
  return cockpit.loading = new Promise((ok, no) => { cockpit.img.onload = ok; cockpit.img.onerror = no; cockpit.img.src = './masks/cockpit.png?v=' + ASSETS; })
    .then(() => { cockpit.ready = true; }).catch(e => console.warn('gold cockpit unavailable', e));
}
let finishGold = false;
async function setFinish(gold){                       // metallic satin pod while gold is on
  if(!liveryMat || gold === finishGold) return;
  finishGold = gold;
  const pbr = liveryMat.pbrMetallicRoughness;
  if(gold){
    cockpit.mr ||= mv.createTexture('./masks/cockpit-mr.png?v=' + ASSETS);
    const t = await cockpit.mr;
    if(!finishGold) return;
    pbr.metallicRoughnessTexture.setTexture(t); pbr.setMetallicFactor(1); pbr.setRoughnessFactor(1);
  } else {
    pbr.metallicRoughnessTexture.setTexture(null); pbr.setMetallicFactor(0); pbr.setRoughnessFactor(0.35);
  }
}

// ---------- partner logo (HRX): a UV mask made by livery-tools/sponsor.mjs, on by default ----------
let sponsorOn = true, spLayout = 'deck', spStyle = 0;
const SP_LAYOUTS = [['deck', 'Deck'], ['arms', 'Arms'], ['full', 'Full'], ['mini', 'Mini']];
const SP_STYLES = [[0, 'Classic'], [1, 'Red'], [2, 'Mono']];
const sponsors = {};                                  // layout -> { img, spots, ready, loading }
function loadSponsor(l){
  if(sponsors[l]) return sponsors[l].loading;
  const sp = sponsors[l] = { img: new Image(), spots: null, ready: false };
  return sp.loading = Promise.all([
    new Promise((ok, no) => { sp.img.onload = ok; sp.img.onerror = no; sp.img.src = `./sponsors/hrx-${l}.png?v=${ASSETS}`; }),
    fetch(`./sponsors/hrx-${l}.json?v=${ASSETS}`).then(r => r.json()).then(j => { sp.spots = j.spots; }),
  ]).then(() => { sp.ready = true; }).catch(e => console.warn('partner logo unavailable', e));
}
loadSponsor(spLayout).then(() => { if(current >= 0) recolorLivery(); });
// Each logo turns white on dark ground, ink on light, judged as a whole from 9 ground samples
// (sponsors/hrx-*.json) on a 512px copy of the livery, after the colourway and the gold cockpit.
const lumCanvas = document.createElement('canvas'); lumCanvas.width = lumCanvas.height = 512;
const lumCtx = lumCanvas.getContext('2d', { willReadFrequently: true });
const pixCache = new WeakMap();
function pixelsOf(img){
  let d = pixCache.get(img);
  if(!d){ lumCtx.clearRect(0, 0, 512, 512); lumCtx.drawImage(img, 0, 0, 512, 512); d = lumCtx.getImageData(0, 0, 512, 512).data; pixCache.set(img, d); }
  return d;
}
function mapJS(c, pal){                               // the shader's palette swap, for one colour
  let best = 1e9, o = c;
  for(let i = 0; i < pal.length; i++) for(let j = i; j < pal.length; j++){
    const a = pal[i][0], ab = pal[j][0].map((x, q) => x - a[q]), L = ab[0] * ab[0] + ab[1] * ab[1] + ab[2] * ab[2];
    const k = L > 0 ? Math.min(1, Math.max(0, ((c[0] - a[0]) * ab[0] + (c[1] - a[1]) * ab[1] + (c[2] - a[2]) * ab[2]) / L)) : 0;
    const d = [0, 1, 2].map(q => c[q] - (a[q] + ab[q] * k)), e = d[0] * d[0] + d[1] * d[1] + d[2] * d[2];
    if(e < best){ best = e; o = mixc(pal[i][1], pal[j][1], k); }
  }
  return o;
}
function spotDark(img, m, gold, sp){
  const px = pixelsOf(img), gpx = gold ? pixelsOf(gold.img) : null, pal = m ? paletteMap(m) : null;
  const out = new Float32Array(12);
  sp.spots.forEach((samples, k) => {
    let lum = 0;
    for(const [u, v] of samples){
      const i = (Math.min(511, Math.floor(v * 512)) * 512 + Math.min(511, Math.floor(u * 512))) * 4;
      let c = [px[i] / 255, px[i + 1] / 255, px[i + 2] / 255];
      if(pal) c = mapJS(c, pal);
      if(gpx && gpx[i] > 127) c = [.788, .635, .353];
      lum += 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
    }
    out[k] = lum / samples.length < 0.5 ? 1 : 0;
  });
  return out;
}
function syncURL(){
  if(current >= 0) history.replaceState(null, '', '?v=' + VERSIONS[current].tab);
}
// colourway chips
const cw = $('colorway'), paintBtn = $('paint');
for(const c of COLOURWAYS){
  const b = document.createElement('button');
  b.className = 'cw mono'; b.type = 'button';
  b.innerHTML = `<i style="--a:${SWATCHES[c.a]};--b:${SWATCHES[c.b]}"><b></b><b></b></i><span>${c.label}</span>`;
  b.setAttribute('aria-label', c.label.replace('<br>', ' and '));
  b.addEventListener('click', () => setColourway(c));
  $('cwRow').appendChild(b); c.btn = b;
}
function setColourway(c){
  colourway = c;
  COLOURWAYS.forEach(x => x.btn.setAttribute('aria-pressed', x === c));
  // page accent follows the livery accent (white when the accent is blue)
  document.documentElement.style.setProperty('--accent', c.b === 'blue' ? '#ffffff' : SWATCHES[c.b]);
  if(current >= 0) showLivery();
  if(c.texture === 'orange' && liveryMat) VERSIONS.forEach(v => texture(v, 'orange').catch(() => {}));   // warm the other orange versions
}
const goldBtn = $('goldToggle');
goldBtn.addEventListener('click', async () => { goldOn = !goldOn; goldBtn.setAttribute('aria-pressed', goldOn); if(goldOn) await loadCockpit(); if(current >= 0) recolorLivery(); });
const spBtn = $('spToggle');
spBtn.addEventListener('click', () => { sponsorOn = !sponsorOn; spBtn.setAttribute('aria-pressed', sponsorOn); $('spOpts').hidden = !sponsorOn; if(current >= 0) recolorLivery(); });
function chipRow(el, items, pick){
  const list = items.map(([id, label]) => {
    const b = document.createElement('button');
    b.className = 'chip mono'; b.type = 'button'; b.textContent = label;
    b.addEventListener('click', () => pick(id));
    el.appendChild(b);
    return [id, b];
  });
  return v => list.forEach(([id, b]) => b.setAttribute('aria-pressed', id === v));
}
const pressLayout = chipRow($('spLayouts'), SP_LAYOUTS, async l => { spLayout = l; pressLayout(l); await loadSponsor(l); if(spLayout === l && current >= 0) recolorLivery(); });
const pressStyle = chipRow($('spStyles'), SP_STYLES, st => { spStyle = st; pressStyle(st); if(current >= 0) recolorLivery(); });
pressLayout(spLayout); pressStyle(spStyle);
function setPanel(open){ cw.hidden = !open; paintBtn.setAttribute('aria-expanded', open); }
paintBtn.addEventListener('click', () => setPanel(cw.hidden));
setPanel(!mqPhone.matches && window.innerHeight > 560);   // open on desktop, behind the button on phones
setColourway(colourway);

// ---------- load ----------
mv.addEventListener('progress', e => { $('bar').style.width = Math.round(e.detail.totalProgress * 100) + '%'; });
mv.addEventListener('load', async () => {
  liveryMat = mv.model.materials.find(m => m.name === 'M_Racebird_Livery Default');
  await apply(startIdx);                            // paint finish (clear coat) comes from racebird.glb
  setResponsiveView(true);                          // ensure correct hero framing once loaded
  $('loader').classList.add('hide');
  VERSIONS.forEach(v => texture(v, 'lime'));       // warm the other liveries for instant switching
});
</script>
