<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-store" />
<meta name="theme-color" content="#1538b4" />
<title>FSP · Team Merch</title>
<meta name="description" content="FSP team merch concepts: jacket, hoodie and T-shirt in FSP blue, white and lime." />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-1 0 8.75 8.75' fill='%231450e6'%3E%3Crect width='2' height='2'/%3E%3Crect x='2.25' width='2' height='2'/%3E%3Crect x='4.5' width='2' height='2'/%3E%3Crect y='2.25' width='2' height='2'/%3E%3Crect y='4.5' width='2' height='2'/%3E%3Crect x='2.25' y='4.5' width='2' height='2'/%3E%3Crect y='6.75' width='2' height='2'/%3E%3C/svg%3E" />
<link rel="preload" href="./fonts/Archivo-variable.woff2" as="font" type="font/woff2" crossorigin />
<script type="module" src="./model-viewer.min.js"></script>
<link rel="stylesheet" href="./hud.css?v=4" />
<style>
  /* model credits (CC BY / MIT): in front so the link works */
  .credit{position:fixed;left:var(--gx);bottom:calc(var(--gy) + var(--sb) + 14px);z-index:6;max-width:240px;
    color:var(--dim);font-size:10px;line-height:1.6;text-decoration:none}
  .credit:hover{color:#fff}
  @media (max-width:1100px){ .credit{bottom:auto;top:calc(var(--gy) + var(--st) + 52px);left:auto;right:var(--gx);text-align:right} }
  @media (max-width:760px){ .credit{max-width:160px;font-size:9px} }
  /* print styles */
  .st-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}
  .st{padding:8px 6px;border-radius:8px;border:1px solid var(--line);color:var(--muted);font-size:9.5px;letter-spacing:.1em;transition:background .2s,color .2s}
  .st:hover{color:#fff;background:rgba(255,255,255,.07)}
  .st[aria-pressed="true"]{background:#fff;color:var(--fsp-blue);border-color:#fff}
  .st:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<!-- Layer 0: text and HUD, behind the garment -->
<div class="backdrop">
  <div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>

  <div class="brand">
    <img src="./images/fsp-f-white.svg" alt="FSP" />
    <div>
      <div class="t1">FSP</div>
      <div class="t2 mono">E1 · Team merch</div>
    </div>
  </div>
  <div class="tag mono"><b>Global competition, solved.</b><br />Powered by AI, ranked worldwide.</div>

  <div class="intro">
    <span class="kicker mono">Team-wear concepts</span>
    <h1>fsp <span class="accent">merch.</span></h1>
  </div>

  <div class="word" id="word" aria-hidden="true"><span id="wordText"></span></div>

  <div class="info" id="info" aria-live="polite">
    <div class="count mono"><span>Style</span><b id="infoNum">01</b><i></i><span id="infoAll">06</span></div>
    <div class="name" id="infoName"></div>
    <p class="desc" id="infoDesc"></p>
  </div>

  <div class="readout mono" aria-hidden="true">
    <div>HDG <b id="hdg">000°</b> · EL <b id="elv">00°</b></div>
    <div>Drag to orbit · Scroll to zoom · ← → switch</div>
  </div>
</div>

<!-- Layer 1: the garment -->
<model-viewer id="mv" alt="FSP team merch"
  camera-controls touch-action="none" interaction-prompt="none"
  auto-rotate auto-rotate-delay="0" rotation-per-second="18deg"
  shadow-intensity="1" shadow-softness="0.6" exposure="0.9" tone-mapping="commerce"
  environment-image="./env/studio.hdr"
  camera-orbit="25deg 82deg 130%" min-field-of-view="8deg" max-field-of-view="40deg"></model-viewer>

<!-- Layer 2: controls -->
<nav class="pages mono" aria-label="Pages"><a href="./">Liveries</a><a href="./merch.html" aria-current="page">Merch</a></nav>
<nav class="controls" id="controls" aria-label="Style">
  <button class="icon nav" id="prev" aria-label="Previous style">
    <svg viewBox="0 0 18 18"><path d="M11 4 6 9l5 5"/></svg>
  </button>
  <div class="dock" id="dock" role="group" aria-label="Choose a style"></div>
  <button class="icon nav" id="next" aria-label="Next style">
    <svg viewBox="0 0 18 18"><path d="m7 4 5 5-5 5"/></svg>
  </button>
</nav>
<div class="colorway mono" id="colorway" role="group" aria-label="Colourway">
  <div class="ttl">Item</div>
  <div class="st-row" id="itRow"></div>
  <div class="ttl">Colourway</div>
  <div class="cw-row" id="cwRow"></div>
</div>
<div class="tools">
  <button class="icon" id="paint" aria-label="Colourway" title="Colourway" aria-controls="colorway" aria-expanded="false">
    <svg viewBox="0 0 18 18"><path d="M3 3h5v5H3zM10 3h5v5h-5zM3 10h5v5H3zM10 10h5v5h-5z"/></svg>
  </button>
  <button class="icon" id="reset" aria-label="Reset view" title="Reset view">
    <svg viewBox="0 0 18 18"><path d="M3.5 9a5.5 5.5 0 1 0 1.6-3.9"/><path d="M3.5 3v3.5H7"/></svg>
  </button>
  <button class="icon" id="play" aria-label="Pause rotation" title="Pause rotation">
    <svg class="i-pause" viewBox="0 0 18 18"><path d="M6.5 4v10M11.5 4v10"/></svg>
    <svg class="i-play" viewBox="0 0 18 18"><path d="M6 4v10l8-5z"/></svg>
  </button>
</div>
<a class="credit mono" id="credit" target="_blank" rel="noopener"></a>

<div class="loader" id="loader">
  <img src="./images/fsp-f-white.svg" alt="" />
  <div class="bar"><i id="bar"></i></div>
  <p class="mono">Loading merch</p>
</div>

<script>
const mv = document.getElementById('mv');
const dock = document.getElementById('dock');
const $ = id => document.getElementById(id);

// Garments are painted by apparel/merch.mjs and built for the web by apparel/tools/web.mjs.
// Bump ASSETS when they change (vercel.json caches them for a day).
const ASSETS = '3';
const ITEMS = [
  { id:'jacket', tab:'01', label:'Jacket', file:'./merch/varsity.glb', prints:'./merch/varsity', mat:'FABRIC_1_FRONT_3990',
    desc:'Team jacket: a navy-to-blue yoke, a lime raglan stripe and a halftone speed sweep.',
    credit:'“Varsity Jacket” by Sev · CC BY 4.0', href:'https://sketchfab.com/3d-models/varsity-jacket-40ee5970950b48b4a38d657dc671f007' },
  { id:'hoodie', tab:'02', label:'Hoodie', file:'./merch/hoodie.glb', prints:'./merch/hoodie', mat:'uniform_1001',
    desc:'Oversized team hoodie: the same sweep, navy cuffs and a lime pinstripe hem.',
    credit:'“Green and white hoodie” by Style3D CG · CC BY 4.0', href:'https://sketchfab.com/3d-models/green-and-white-hoodie-af100701826e4bb9abc1ff1a1d24ab1e' },
  { id:'tshirt', tab:'03', label:'T-shirt', file:'./merch/tshirt.glb', prints:'./merch/tshirt', mat:'lambert1',
    desc:'Sublimated team tee: a white chest band with the E1 and FSP marks over a fading blue sweep.',
    credit:'T-shirt model: Poimandres · MIT', href:'https://github.com/pmndrs/examples' },
];
// print styles (apparel/designs/*.mjs, built by apparel/tools/web.mjs as <garment>-<style>-<accent>.webp)
const STYLES = [
  { id:'track',     tab:'01', label:'Track',      desc:'Gradient yoke, lime raglan stripe and a halftone speed sweep.' },
  { id:'pixelfade', tab:'02', label:'Pixel Fade', desc:'Navy-to-FSP-blue shoulders dissolving into a white body of FSP pixels.' },
  { id:'circuit',   tab:'03', label:'Circuit',    desc:'Esports PCB kit: navy to FSP blue, light-blue traces and a lime signal bus.' },
  { id:'split',     tab:'04', label:'Split',      desc:'A bold diagonal colour block: navy-to-blue field, white panel, lime split line.' },
  { id:'shard',     tab:'05', label:'Shard',      desc:'Blue glass shards burst from the hem and shoulders, with two lime blades.' },
  { id:'paddock',   tab:'06', label:'Paddock',    desc:'Navy paddock wear: FSP-blue side panels, sharp cuts, lime piping, F monogram.' },
];
const SWATCHES = { blue:'#1450e6', orange:'#ff5b13', lime:'#c8f04a' };
const COLOURWAYS = [
  { label:'Blue<br>Lime',   a:'blue', b:'lime',   print:'lime' },
  { label:'Blue<br>Orange', a:'blue', b:'orange', print:'orange' },
];
let colourway = COLOURWAYS[0];
const params = new URLSearchParams(location.search);
const find = (list, key, fallback) => { const v = (params.get(key) || '').toLowerCase(), i = list.findIndex(x => x.id === v || x.tab === v); return i >= 0 ? i : fallback; };
const startStyle = find(STYLES, 's', 0);
const startItem = find(ITEMS, 'g', ITEMS.findIndex(g => g.id === 'hoodie'));   // the hoodie by default
$('infoAll').textContent = String(STYLES.length).padStart(2, '0');
customElements.whenDefined('model-viewer').then(() => { customElements.get('model-viewer').minimumRenderScale = 1; });

function sceneOf(){ const key = Object.getOwnPropertySymbols(mv).find(s => s.description === 'scene'); return key && mv[key]; }
function sharpen(){                                   // 16x anisotropy on the prints (model-viewer internals)
  try{
    const scene = sceneOf(); if(!scene) return;
    scene.traverse(o => { const t = o.isMesh && o.material && o.material.map; if(t && t.anisotropy < 16){ t.anisotropy = 16; t.needsUpdate = true; } });
    if(scene.queueRender) scene.queueRender();
  }catch(e){ /* keep the default filtering */ }
}

let current = -1, item = -1, printMat = null, limeTex = null, prints = new Map();   // current = style index; prints: url -> Promise<texture>, per loaded garment

// ---------- giant name + info: the style, on the chosen item ----------
const word = $('word'), wordText = $('wordText');
const mqPhone = window.matchMedia('(max-width: 760px)');
function fitWord(){
  wordText.style.fontSize = '100px';
  const w = wordText.getBoundingClientRect().width; if(!w) return;
  const maxW = innerWidth * (mqPhone.matches ? 0.94 : 0.9), maxH = innerHeight * (mqPhone.matches ? 0.2 : 0.34);
  wordText.style.fontSize = Math.min(100 * maxW / w, maxH) + 'px';
}
let infoTimer = 0;
function showInfo(animate){
  const st = STYLES[current], g = ITEMS[item];
  const set = () => {
    wordText.textContent = st.label.toLowerCase(); fitWord();
    $('infoNum').textContent = st.tab; $('infoName').textContent = `${st.label} · ${g.label}`; $('infoDesc').textContent = st.desc;
    $('credit').textContent = g.credit; $('credit').href = g.href;
    word.classList.remove('out'); $('info').classList.remove('out');
  };
  clearTimeout(infoTimer);
  if(!animate){ set(); return; }
  word.classList.add('out'); $('info').classList.add('out');
  infoTimer = setTimeout(set, 200);
}
function syncURL(){
  const q = new URLSearchParams({ g: ITEMS[item].id });
  if(current > 0) q.set('s', STYLES[current].id);
  history.replaceState(null, '', '?' + q);
}

// ---------- dock: the styles ----------
const slider = document.createElement('div');
slider.className = 'slider';
dock.appendChild(slider);
const segs = STYLES.map((st, i) => {
  const b = document.createElement('button');
  b.className = 'seg';
  b.innerHTML = `<span class="n">${st.tab}</span><span class="l">${st.label}</span>`;
  b.title = st.label; b.setAttribute('aria-label', `${st.tab} ${st.label}`);
  b.addEventListener('click', () => apply(i));
  dock.appendChild(b);
  return b;
});
function moveSlider(i){ const s = segs[i]; slider.style.width = s.offsetWidth + 'px'; slider.style.transform = 'translateX(' + s.offsetLeft + 'px)'; }
addEventListener('resize', () => { if(current >= 0) moveSlider(current); fitWord(); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if(current >= 0) moveSlider(current); fitWord(); });

function apply(i){
  i = (i + STYLES.length) % STYLES.length;
  if(i === current) return;
  const first = current < 0;
  current = i;
  segs.forEach((s, k) => { s.classList.toggle('active', k === i); s.setAttribute('aria-pressed', k === i); });
  moveSlider(i);
  if(item < 0) return;                               // start-up: setItem() shows the info and loads
  showInfo(!first);
  syncURL();
  showPrint();
}
$('prev').addEventListener('click', () => apply(current - 1));
$('next').addEventListener('click', () => apply(current + 1));
document.addEventListener('keydown', e => {
  if(e.altKey || e.ctrlKey || e.metaKey) return;
  if(e.key === 'ArrowLeft') apply(current - 1);
  else if(e.key === 'ArrowRight') apply(current + 1);
  else if(/^[1-9]$/.test(e.key) && +e.key <= STYLES.length) apply(+e.key - 1);
});

// ---------- item (jacket / hoodie / T-shirt) in the panel ----------
for(const [i, g] of ITEMS.entries()){
  const b = document.createElement('button');
  b.className = 'st mono'; b.type = 'button'; b.textContent = g.label;
  b.addEventListener('click', () => setItem(i));
  $('itRow').appendChild(b); g.btn = b;
}
function setItem(i){
  if(i === item) return;
  const first = item < 0;
  item = i;
  ITEMS.forEach((g, k) => g.btn.setAttribute('aria-pressed', k === i));
  showInfo(!first);
  if(!first) syncURL();
  printMat = limeTex = null; prints = new Map();
  mv.src = `${ITEMS[i].file}?v=${ASSETS}`;           // the print is applied on 'load'
}

// ---------- print: Track/Lime is in the GLB; every other style/colourway is a WebP ----------
async function showPrint(){
  if(!printMat) return;
  const c = colourway, st = STYLES[current], g = ITEMS[item];
  let t = limeTex;
  if(!(st.id === 'track' && c.print === 'lime')){
    const url = `${g.prints}-${st.id}-${c.print}.webp?v=${ASSETS}`;
    if(!prints.has(url)) prints.set(url, mv.createTexture(url));
    t = await prints.get(url);
  }
  if(colourway !== c || STYLES[current] !== st || ITEMS[item] !== g || !printMat || !t) return;
  printMat.pbrMetallicRoughness.baseColorTexture.setTexture(t);
  sharpen();
}
const cw = $('colorway'), paintBtn = $('paint');
for(const c of COLOURWAYS){
  const b = document.createElement('button');
  b.className = 'cw mono'; b.type = 'button';
  b.innerHTML = `<i style="--a:${SWATCHES[c.a]};--b:${SWATCHES[c.b]}"><b></b><b></b></i><span>${c.label}</span>`;
  b.setAttribute('aria-label', c.label.replace('<br>', ' and '));
  b.addEventListener('click', () => setColourway(c));
  $('cwRow').appendChild(b); c.btn = b;
}
function setColourway(c){
  colourway = c;
  COLOURWAYS.forEach(x => x.btn.setAttribute('aria-pressed', x === c));
  document.documentElement.style.setProperty('--accent', SWATCHES[c.b]);
  showPrint();
}
function setPanel(open){ cw.hidden = !open; paintBtn.setAttribute('aria-expanded', open); }
paintBtn.addEventListener('click', () => setPanel(cw.hidden));
setPanel(!mqPhone.matches && innerHeight > 560);
setColourway(colourway);

// ---------- camera: reset, play / pause ----------
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let paused = reduceMotion;
const play = $('play');
function setPaused(p){
  paused = p;
  play.classList.toggle('paused', p);
  play.setAttribute('aria-label', p ? 'Resume rotation' : 'Pause rotation'); play.title = play.getAttribute('aria-label');
  if(p) mv.removeAttribute('auto-rotate'); else mv.setAttribute('auto-rotate', '');
}
play.addEventListener('click', () => setPaused(!paused));
if(paused) setPaused(true);
$('reset').addEventListener('click', () => {
  if(mv.resetTurntableRotation) mv.resetTurntableRotation(0);
  mv.setAttribute('camera-orbit', '25deg 82deg 130%'); mv.removeAttribute('field-of-view');
});

// HUD readout: viewing heading relative to the garment and elevation
const hdg = $('hdg'), elv = $('elv');
let lastRead = '';
(function readout(){
  requestAnimationFrame(readout);
  if(!mv.loaded || mqPhone.matches) return;
  const o = mv.getCameraOrbit(), tt = mv.turntableRotation || 0;
  let h = ((o.theta - tt) * 180 / Math.PI) % 360; if(h < 0) h += 360;
  const e = Math.round(90 - o.phi * 180 / Math.PI), s = String(Math.round(h) % 360).padStart(3, '0') + '|' + e;
  if(s === lastRead) return;
  lastRead = s; hdg.textContent = s.slice(0, 3) + '°'; elv.textContent = String(e).padStart(2, '0') + '°';
})();

// ---------- load ----------
mv.addEventListener('progress', e => { $('bar').style.width = Math.round(e.detail.totalProgress * 100) + '%'; });
mv.addEventListener('load', async () => {
  const g = ITEMS[item];
  printMat = mv.model.materials.find(m => m.name === g.mat) || null;
  limeTex = printMat && printMat.pbrMetallicRoughness.baseColorTexture.texture;
  await showPrint();
  sharpen();
  $('loader').classList.add('hide');
});
apply(startStyle);
setItem(startItem);
</script>
</body>
</html>
